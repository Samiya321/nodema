name: Sync sources
# Started only from the dashboard's "Sync now" button: fetch requested/due sources,
# materialize Sub-Store children and refresh airport usage. Never runs node tests.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Repeated clicks collapse into at most one running and one pending sync.
  group: nodema-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Hundreds of subscriptions plus landing-IP lookups; minutes are free (public repo).
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      ENCRYPTION_KEY_B64: ${{ secrets.ENCRYPTION_KEY_B64 }}
      ENCRYPTION_KEY_ID: ${{ vars.ENCRYPTION_KEY_ID || 'local-v1' }}
      FINGERPRINT_KEY_B64: ${{ secrets.FINGERPRINT_KEY_B64 }}
      FRESHNESS_HOURS: ${{ vars.FRESHNESS_HOURS || '36' }}
      SCAN_TIMEZONE: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: network
        name: Start network interface counters
        run: python3 scripts/job_network.py
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - id: dependencies
        run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: Synchronize requested and due sources
        shell: bash
        run: |
          set +e
          uv run nodema source sync-all --due-only
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
      - name: Look up landing IP details
        # ip-api free tier; a failed lookup only delays org names to the next run.
        if: always() && steps.dependencies.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: uv run nodema ipinfo refresh
      - name: Publish current subscriptions
        if: always() && steps.dependencies.outcome == 'success'
        run: uv run nodema export build-pending
      - name: Record job network usage
        if: always() && steps.network.outcome == 'success' && steps.dependencies.outcome == 'success'
        env:
          JOB_RESULT: ${{ job.status }}
          USAGE_JOB_KEY: sync
        run: uv run nodema usage record-job --sample-file private/job-network.json --outcome "$JOB_RESULT"
