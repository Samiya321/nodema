name: Entry probes and grades
run-name: ${{ inputs.monitor_retry && 'Maintenance retry · probe' || 'Entry probes and grades' }}
on:
  # Started every hour at :30 UTC by the API Worker's Cron Trigger (cloudflare/api-worker
  # wrangler.jsonc): GitHub's own schedule was delayed by hours or dropped. Beijing
  # 19:30-23:30 is the carriers' peak window (see grading rules); other hours buy HK/SG,
  # reachability and route samples.
  workflow_dispatch:
    inputs:
      monitor_retry:
        type: boolean
        default: false
      refresh_only:
        description: Recompute grades from existing observations
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nodema-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINGERPRINT_KEY_B64: ${{ secrets.FINGERPRINT_KEY_B64 }}
      ENCRYPTION_KEY_B64: ${{ secrets.ENCRYPTION_KEY_B64 }}
      ENCRYPTION_KEY_ID: ${{ vars.ENCRYPTION_KEY_ID || 'local-v1' }}
      FRESHNESS_HOURS: ${{ vars.FRESHNESS_HOURS || '36' }}
      # Optional account tokens, separated by newlines or commas. Takes precedence
      # over the legacy single token. Both empty = anonymous mode.
      GLOBALPING_TOKENS: ${{ secrets.GLOBALPING_TOKENS }}
      GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
      PROBE_EXCLUDED_IPS: ${{ secrets.PROBE_EXCLUDED_IPS }}
      PROBE_CONCURRENCY: ${{ vars.PROBE_CONCURRENCY || '6' }}
      PROBE_MAX_TESTS_PER_RUN: ${{ vars.PROBE_MAX_TESTS_PER_RUN || '5000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/database-tunnel
        if: vars.NODEMA_DATABASE_VIA_SSH == 'true'
        with:
          connection: ${{ secrets.NODEMA_POSTGRES_SSH }}
          protect_entry_probes: 'true'
      - id: network
        run: python3 scripts/job_network.py
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - id: dependencies
        run: uv sync --frozen
      - name: Measure entries (counts only in the log)
        if: '!inputs.refresh_only'
        continue-on-error: true
        timeout-minutes: 30
        run: uv run nodema probe run
      - name: Recompute grades
        if: always() && steps.dependencies.outcome == 'success'
        env:
          REFRESH_ONLY: ${{ inputs.refresh_only }}
        run: |
          if [ "$REFRESH_ONLY" = true ]; then
            uv run nodema grade refresh
          else
            uv run nodema grade refresh --if-due
          fi
      - name: Rebuild subscriptions that filter by grade
        if: always() && steps.dependencies.outcome == 'success'
        run: uv run nodema export build-pending
      - name: Record job network usage
        if: '!cancelled() && steps.network.outcome == ''success'' && steps.dependencies.outcome == ''success'''
        env:
          JOB_RESULT: ${{ job.status }}
          USAGE_JOB_KEY: entry-probe
        run: uv run nodema usage record-job --sample-file private/job-network.json --outcome "$JOB_RESULT"
