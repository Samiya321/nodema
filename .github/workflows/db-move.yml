name: Move database (one-off)
# Copies the database between two PostgreSQL instances on a US runner (see
# scripts/move_database.py). Needs the temporary secrets MOVE_SOURCE_DATABASE_URL and
# MOVE_TARGET_DATABASE_URL; delete them (and pause writers first) as described in
# docs/PRODUCTION_OPERATIONS.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: full copies everything; reduced keeps only referenced test_results rows
        type: choice
        options: [reduced, full]
        default: reduced
permissions:
  contents: read
concurrency:
  group: nodema-db-move
  cancel-in-progress: false
jobs:
  move:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_DATABASE_URL: ${{ secrets.MOVE_SOURCE_DATABASE_URL }}
      TARGET_DATABASE_URL: ${{ secrets.MOVE_TARGET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: docker pull -q postgres:17-alpine
      - run: uv run python scripts/move_database.py --mode "${{ inputs.mode }}"
