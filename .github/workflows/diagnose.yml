name: Diagnose untestable nodes
# Started by hand only. Read-only: counts of why nodes are UNSUPPORTED (protocol and
# field names, never values), written to the run summary. ~3 MB + ~15 MB (recently checked configs) of Neon transfer.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENCRYPTION_KEY_B64: ${{ secrets.ENCRYPTION_KEY_B64 }}
      ENCRYPTION_KEY_ID: ${{ vars.ENCRYPTION_KEY_ID || 'local-v1' }}
      FINGERPRINT_KEY_B64: ${{ secrets.FINGERPRINT_KEY_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/database-tunnel
        if: vars.NODEMA_DATABASE_VIA_SSH == 'true'
        with:
          connection: ${{ secrets.NODEMA_POSTGRES_SSH }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Count conversion rejection reasons
        run: |
          uv run nodema node unsupported-reasons --limit 60 | tee reasons.json
          { echo '```json'; cat reasons.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Outcomes of the newer conversion mappings, unreadable protocol names
        run: |
          uv run nodema node mapping-outcomes | tee mappings.json
          { echo '```json'; cat mappings.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
