name: Collect safe workflow usage
on:
  workflow_run:
    workflows: [Daily node health, Import and check queued sources, Encrypted database backup, Build private subscriptions]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: nodema-usage-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      ENCRYPTION_KEY_B64: ${{ secrets.ENCRYPTION_KEY_B64 }}
      ENCRYPTION_KEY_ID: ${{ vars.ENCRYPTION_KEY_ID || 'local-v1' }}
      FINGERPRINT_KEY_B64: ${{ secrets.FINGERPRINT_KEY_B64 }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_WORKFLOW_REF: ${{ github.event.repository.default_branch }}
      COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
      COMPLETED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      # Never checkout the triggering run's SHA or download its artifacts/logs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run nodema usage collect-actions --run-id "$COMPLETED_RUN_ID" --attempt "$COMPLETED_ATTEMPT"
      - run: uv run nodema usage sample
