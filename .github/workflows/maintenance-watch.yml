name: Production maintenance watch
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Allow bounded recovery dispatches and incident notifications
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: nodema-maintenance-watch
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
      NODEMA_HEARTBEAT_URL: https://nodema-dashboard.pages.dev/api/ops/heartbeat
      NODEMA_TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
      ENABLE_RECOVERY: ${{ github.event_name == 'schedule' || inputs.apply }}
      BACKUP_SKIP_UNTIL: ${{ vars.BACKUP_SKIP_UNTIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/maintenance_watch.py
