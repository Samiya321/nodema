name: Archive expired history
on:
  # The API Worker dispatches this at 07:30 Beijing.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodema-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINGERPRINT_KEY_B64: ${{ secrets.FINGERPRINT_KEY_B64 }}
      ENCRYPTION_KEY_B64: ${{ secrets.ENCRYPTION_KEY_B64 }}
      ENCRYPTION_KEY_ID: ${{ vars.ENCRYPTION_KEY_ID || 'local-v1' }}
      SCAN_TIMEZONE: Asia/Shanghai
      PGOPTIONS: "-c lock_timeout=3s -c statement_timeout=300s"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/database-tunnel
        if: vars.NODEMA_DATABASE_VIA_SSH == 'true'
        with:
          connection: ${{ secrets.NODEMA_POSTGRES_SSH }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run nodema cleanup
