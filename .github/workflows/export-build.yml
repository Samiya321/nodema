name: Build private subscriptions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodema-exports
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      FINGERPRINT_KEY_B64: ${{ secrets.FINGERPRINT_KEY_B64 }}
      FRESHNESS_HOURS: ${{ vars.FRESHNESS_HOURS || '36' }}
      ENCRYPTION_KEY_B64: ${{ secrets.ENCRYPTION_KEY_B64 }}
      ENCRYPTION_KEY_ID: ${{ vars.ENCRYPTION_KEY_ID || 'local-v1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: network
        run: python3 scripts/job_network.py
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.12'
      - id: dependencies
        run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run nodema export build-pending
      - name: Record job network usage
        if: always() && steps.network.outcome == 'success' && steps.dependencies.outcome == 'success'
        env:
          JOB_RESULT: ${{ job.status }}
          USAGE_JOB_KEY: export-build
        run: uv run nodema usage record-job --sample-file private/job-network.json --outcome "$JOB_RESULT"
