services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 128m
    command: [tunnel, --no-autoupdate, --metrics, 127.0.0.1:20241, run, --token-file, /run/nodema/tunnel-token]
    volumes:
      - ./secrets/tunnel-token:/run/nodema/tunnel-token:ro
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
