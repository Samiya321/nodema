<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nodema 节点台</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/js/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#page">跳到主要内容</a>
    <section id="login" class="login" aria-labelledby="login-title">
      <div class="login-card">
        <p class="brand-mark" aria-hidden="true">N</p>
        <h1 id="login-title" tabindex="-1">Nodema 节点台</h1>
        <p id="session-status" class="muted" role="status">正在检查登录状态…</p>
        <p id="login-error" class="form-error" role="alert"></p>
        <form id="login-form" class="stack" method="post" action="/api/session" hidden>
          <input type="text" name="username" value="admin" autocomplete="username" hidden />
          <div class="field">
            <label class="field-label" for="login-token">管理员密钥</label>
            <input id="login-token" type="password" required minlength="24" autocomplete="current-password" aria-describedby="login-hint login-error" />
            <span id="login-hint" class="hint">登录有效期为 8 小时。</span>
          </div>
          <button id="login-submit" class="primary" type="submit">登录</button>
          <button id="session-retry" type="button" hidden>重新检查登录状态</button>
        </form>
      </div>
    </section>
    <div id="app" class="app" hidden>
      <nav class="rail" aria-label="主要导航">
        <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">N</span><span>Nodema</span></a>
        <ul id="nav"></ul>
        <div class="rail-bottom">
          <a href="#/settings" data-page="settings">设置</a>
          <button class="quiet" type="button" data-logout>退出</button>
        </div>
        <details class="nav-more">
          <summary>更多</summary>
          <div class="nav-more-panel">
            <a href="#/ops" data-page="ops">运维</a>
            <a href="#/settings" data-page="settings">设置</a>
            <button class="quiet" type="button" data-logout>退出</button>
          </div>
        </details>
      </nav>
      <div class="main">
        <header id="strip" class="strip" aria-label="同步与检测"></header>
        <main id="page" tabindex="-1"></main>
        <footer class="foot muted">地区与 ASN 来自 Cloudflare Echo 与 MaxMind GeoLite；接入质量为 Globalping 社区探针 TCP 实测；不判断线路类型。</footer>
      </div>
    </div>
    <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
  </body>
</html>
