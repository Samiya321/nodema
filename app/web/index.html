<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nodema 节点台</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/js/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#page">跳到主要内容</a>
    <section id="login" class="login" hidden>
      <form id="login-form" class="login-card">
        <p class="brand-mark" aria-hidden="true">N</p>
        <h1>Nodema 节点台</h1>
        <p class="muted">管理自建节点、机场订阅和 Sub-Store，按需同步与检测。</p>
        <input type="text" name="username" value="admin" autocomplete="username" hidden />
        <label class="field" for="login-token">
          <span class="field-label">管理员密钥</span>
          <input id="login-token" name="token" type="password" required minlength="24" autocomplete="current-password" />
          <span class="hint">只保存在当前浏览器标签页，关闭后需重新输入。</span>
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="primary" type="submit">进入</button>
      </form>
    </section>
    <div id="app" class="app" hidden>
      <nav class="rail" aria-label="主要导航">
        <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">N</span><span>Nodema</span></a>
        <ul id="nav"></ul>
        <button id="logout" class="quiet" type="button">退出</button>
      </nav>
      <div class="main">
        <header id="strip" class="strip" aria-label="同步与检测"></header>
        <main id="page" tabindex="-1"></main>
        <footer class="foot muted">地区与 ASN 来自 Cloudflare Echo 与 MaxMind GeoLite；接入质量为 Globalping 社区探针 TCP 实测；不判断线路类型。</footer>
      </div>
    </div>
    <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
  </body>
</html>
