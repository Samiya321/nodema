<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nodema 节点台</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/js/main.js"></script>
  </head>
  <body>
    <a class="skip" href="#page">跳到主要内容</a>
    <section id="login" class="login" aria-labelledby="login-title">
      <div class="login-card">
        <p class="brand-mark" aria-hidden="true">N</p>
        <h1 id="login-title" tabindex="-1">Nodema 节点台</h1>
        <p id="session-status" class="muted" role="status">正在检查登录状态…</p>
        <p id="login-error" class="form-error" role="alert"></p>
        <form id="login-form" class="stack" method="post" action="/api/session" hidden>
          <input type="text" name="username" value="admin" autocomplete="username" hidden />
          <div class="field">
            <label class="field-label" for="login-token">管理员密钥</label>
            <input id="login-token" type="password" required minlength="24" autocomplete="current-password" aria-describedby="login-hint login-error" />
            <span id="login-hint" class="hint">登录有效期为 8 小时。</span>
          </div>
          <button id="login-submit" class="primary" type="submit">登录</button>
          <button id="session-retry" type="button" hidden>重新检查登录状态</button>
        </form>
      </div>
    </section>
    <div id="app" class="app" hidden>
      <svg class="rail-symbols" width="0" height="0" aria-hidden="true" focusable="false">
        <symbol id="rail-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
        <symbol id="rail-nodes" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01M12 7.5h5M12 16.5h5"/></symbol>
        <symbol id="rail-sources" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
        <symbol id="rail-exports" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
        <symbol id="rail-ops" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></symbol>
        <symbol id="rail-settings" viewBox="0 0 24 24"><path d="M4 6h5m4 0h7M4 12h10m4 0h2M4 18h2m4 0h10M9 3v6m5 0v6m-8 0v6"/></symbol>
        <symbol id="rail-logout" viewBox="0 0 24 24"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m-1-8h11m-4-4 4 4-4 4"/></symbol>
        <symbol id="rail-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
      </svg>
      <nav class="rail" aria-label="主要导航">
        <div class="rail-head">
          <a class="brand" href="#/overview" title="Nodema"><span class="brand-mark" aria-hidden="true">N</span><span class="rail-label">Nodema</span></a>
          <button class="rail-toggle" type="button" aria-expanded="true" aria-controls="nav rail-account" aria-label="收起侧栏" title="收起侧栏">
            <svg class="rail-icon" aria-hidden="true" focusable="false"><use href="#rail-panel"/></svg>
          </button>
        </div>
        <ul id="nav"></ul>
        <div class="rail-bottom" id="rail-account">
          <a class="rail-item" href="#/settings" data-page="settings" title="设置">
            <svg class="rail-icon" aria-hidden="true" focusable="false"><use href="#rail-settings"/></svg><span class="rail-label">设置</span>
          </a>
          <button class="rail-item" type="button" data-logout title="退出">
            <svg class="rail-icon" aria-hidden="true" focusable="false"><use href="#rail-logout"/></svg><span class="rail-label">退出</span>
          </button>
        </div>
        <details class="nav-more">
          <summary>更多</summary>
          <div class="nav-more-panel">
            <a href="#/ops" data-page="ops">运维</a>
            <a href="#/settings" data-page="settings">设置</a>
            <button class="quiet" type="button" data-logout>退出</button>
          </div>
        </details>
      </nav>
      <div class="main">
        <header id="strip" class="strip" aria-label="同步与检测"></header>
        <main id="page" tabindex="-1"></main>
        <footer class="foot muted">地区与 ASN 来自 Cloudflare Echo 与 MaxMind GeoLite；接入质量为 Globalping 社区探针 TCP 实测；不判断线路类型。</footer>
      </div>
    </div>
    <div id="toast" class="toast-region" role="status" aria-live="polite"></div>
  </body>
</html>
