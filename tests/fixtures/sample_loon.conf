# Synthetic documentation addresses and credentials only.
[Proxy]
Synthetic SS = shadowsocks, ss.example, 443, aes-128-gcm, "synthetic-ss"
Synthetic VMess = vmess, vmess.example, 443, auto, "00000000-0000-4000-8000-000000000001", transport=ws, path=/ws, host=ws.example, over-tls=true, tls-name=tls.example, alterId=0
Synthetic VLESS = vless, vless.example, 443, "00000000-0000-4000-8000-000000000002", over-tls=true, tls-name=tls.example
Synthetic Trojan = trojan, trojan.example, 443, "synthetic-trojan", over-tls=true, tls-name=tls.example
Synthetic AnyTLS = anytls, anytls.example, 443, "synthetic-anytls", over-tls=true, idle-session-check-interval=30, idle-session-timeout=60, min-idle-session=1
Synthetic Hysteria2 = hysteria2, hy2.example, 443, "synthetic-hy2", server-ports="443,8443-8445", hop-interval=30, salamander-password=synthetic-obfs, alpn="h3"
